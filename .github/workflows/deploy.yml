# main 에 올라오면 빌드해서 Cloudflare Workers 에 배포합니다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Check the live site serves this build
        run: |
          sleep 5
          want=$(grep -o 'assets/main-[^"]*\.js' dist/index.html)
          got=$(curl -fsS https://munin-2026.troyeverywhere.workers.dev/ | grep -o 'assets/main-[^"]*\.js')
          echo "built: $want / live: $got"
          test "$want" = "$got"
