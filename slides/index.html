<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>진행 장표 · 2026 문인 동문회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 진행 장표 (11/21 최종본 PDF). 장을 바꾸려면 public/slides/ 의 이미지와 아래 SLIDES 목록을 고칩니다. */
  html, body { margin: 0; height: 100%; background: #1f3a45; font-family: "Pretendard Variable", Pretendard, sans-serif; color: #fff; }
  .deck { height: 100%; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  .stage img { transform-origin: 0 0; will-change: transform; -webkit-user-drag: none; pointer-events: none; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.3); background: #2b4c55; }
  .bar { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 6px 0 14px; }
  .bar button { width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 24px; cursor: pointer; }
  .bar button:disabled { opacity: .35; }
  .bar .reset { width: auto; height: 36px; border-radius: 999px; padding: 0 14px; font-size: 13px; font-weight: 700; }
  body.fs .hint { display: none; }
  body.fs .stage { padding: 4px; }
  body.fs .stage img { border-radius: 0; box-shadow: none; }
  body.fs .bar { padding: 2px 0 calc(6px + env(safe-area-inset-bottom)); gap: 8px; }
  body.fs .bar button { width: 40px; height: 40px; font-size: 20px; }
  body.fs .bar .reset { width: auto; height: 34px; }
  .hint { text-align: center; font-size: 12px; opacity: .6; margin: -6px 0 10px; }
  .bar span { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
</style>
</head>
<body>
<div class="deck">
  <div class="stage" id="stage"><img id="img" alt=""></div>
  <div class="bar"><button id="prev" aria-label="이전 장">‹</button><span id="pg"></span><button id="next" aria-label="다음 장">›</button><button id="reset" class="reset" hidden>원래 크기</button><button id="fs" class="reset" aria-label="전체화면">⛶ 전체화면</button></div>
  <div class="hint" id="hint">두 손가락으로 벌리거나 두 번 탭하면 크게 볼 수 있어요</div>
</div>
<script>
  const SLIDES = [
    '2026 문화인류학과 동문회 · 2026.11.21. SAT 6PM · 연세 백양누리 그랜드볼룸B',
    '일정 안내',
    '1~2부 자리 안내',
    '3부 자리 안내 (명단)',
    '3부 자리 안내 (테이블 배치)',
    '2부 행사 · 소식나눔·럭키드로우',
    '잠시 후 소식 나눔과 네트워킹 행사가 시작됩니다',
    '사회자 소개 · 방창훈',
    '공식 인사 · 교수님 소개',
    '공식 인사 · 문화인류학과 학생회',
    '공식 인사 · 문화인류학과 동문회',
    '감사 인사 · 동문회를 지원해주신 분들',
    'LUCKY DRAW',
    '문인 동문회 웹사이트 안내',
    '3부 행사 · 관심사별 네트워킹',
    '자리 안내 (테이블 배치)',
    '자리 안내 (명단)',
    '마무리 인사 · 문화인류학과 동문회',
    '뒤풀이 안내',
    '2028 문화인류학과 20주년에 다시 만나요',
  ];
  const src = (k) => `./${String(k + 1).padStart(2, '0')}.webp`;
  const img = document.getElementById('img');
  let i = Math.max(0, Math.min(SLIDES.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  const show = () => {
    img.src = src(i); img.alt = SLIDES[i];
    document.getElementById('pg').textContent = `${i + 1} / ${SLIDES.length}`;
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === SLIDES.length - 1;
    history.replaceState(null, '', '#' + (i + 1));
    [i - 1, i + 1].forEach((k) => { if (k >= 0 && k < SLIDES.length) new Image().src = src(k); });
  };
  // ---- 확대 / 이동 ----
  const st = document.getElementById('stage');
  let z = 1, tx = 0, ty = 0;
  const base = () => { const r = st.getBoundingClientRect(); return { x: r.left + img.offsetLeft, y: r.top + img.offsetTop, w: img.offsetWidth, h: img.offsetHeight }; };
  const apply = () => {
    const b = base();
    if (z <= 1.001) { z = 1; tx = 0; ty = 0; }
    else {
      // 이미지가 화면 밖으로 너무 벗어나지 않게
      const sw = st.clientWidth, sh = st.clientHeight, ox = img.offsetLeft, oy = img.offsetTop;
      const W = b.w * z, H = b.h * z;
      tx = W <= sw ? (sw - W) / 2 - ox : Math.min(-ox, Math.max(sw - W - ox, tx));
      ty = H <= sh ? (sh - H) / 2 - oy : Math.min(-oy, Math.max(sh - H - oy, ty));
    }
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
    document.getElementById('reset').hidden = z === 1;
  };
  const zoomAt = (nz, cx, cy) => {
    const b = base();
    nz = Math.max(1, Math.min(5, nz));
    const px = (cx - b.x - tx) / z, py = (cy - b.y - ty) / z;
    tx = cx - b.x - px * nz; ty = cy - b.y - py * nz; z = nz; apply();
  };
  const resetZoom = () => { z = 1; apply(); };
  document.getElementById('reset').onclick = resetZoom;
  addEventListener('resize', apply);

  const go = (d) => { const n = Math.max(0, Math.min(SLIDES.length - 1, i + d)); if (n !== i) { i = n; z = 1; show(); apply(); } };
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
    if (e.key === '0' || e.key === 'Escape') resetZoom();
  });

  const pts = new Map();
  let pinch = null, pan = null, swipe = null, lastTap = 0, lastTapXY = [0, 0];
  st.addEventListener('pointerdown', (e) => {
    st.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 };
      pan = swipe = null;
    } else if (pts.size === 1) {
      if (z > 1) pan = { x: e.clientX, y: e.clientY, tx, ty };
      swipe = { x: e.clientX, y: e.clientY, t: performance.now() };
    }
  });
  st.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      tx += mx - pinch.mx; ty += my - pinch.my; pinch.mx = mx; pinch.my = my;
      zoomAt(pinch.z * d / pinch.d, mx, my);
    } else if (pan) {
      tx = pan.tx + e.clientX - pan.x; ty = pan.ty + e.clientY - pan.y; apply();
    }
  });
  const up = (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pinch) { if (pts.size < 2) pinch = null; if (pts.size === 1 && z > 1) { const [p] = [...pts.values()]; pan = { x: p[0], y: p[1], tx, ty }; } return; }
    if (swipe) {
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y, quick = performance.now() - swipe.t < 300;
      if (z === 1 && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
      else if (quick && Math.hypot(dx, dy) < 10) {
        const now = performance.now();
        if (now - lastTap < 320 && Math.hypot(e.clientX - lastTapXY[0], e.clientY - lastTapXY[1]) < 40) { z > 1 ? resetZoom() : zoomAt(2.5, e.clientX, e.clientY); lastTap = 0; }
        else { lastTap = now; lastTapXY = [e.clientX, e.clientY]; }
      }
    }
    pan = swipe = null;
  };
  st.addEventListener('pointerup', up);
  st.addEventListener('pointercancel', up);
  // 노트북 트랙패드 핀치 / Ctrl+휠
  st.addEventListener('wheel', (e) => { if (!e.ctrlKey && z === 1) return; e.preventDefault(); if (e.ctrlKey) zoomAt(z * Math.exp(-e.deltaY / 200), e.clientX, e.clientY); else { tx -= e.deltaX; ty -= e.deltaY; apply(); } }, { passive: false });
  // iOS 사파리가 페이지 전체를 확대하지 않게
  for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
  // ---- 전체화면 ----
  // 1) 브라우저 전체화면(컴퓨터·안드로이드·아이패드) 2) 안 되면 사이트 안의 장표 창을 화면 가득(아이폰)
  const fsBtn = document.getElementById('fs');
  const inFrame = window.parent !== window;
  const native = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  let pseudo = false;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement) || pseudo;
  const sync = () => {
    const on = isFs();
    document.body.classList.toggle('fs', on);
    fsBtn.textContent = on ? '✕ 나가기' : '⛶ 전체화면';
    setTimeout(apply, 50);
  };
  const setPseudo = (on) => { pseudo = on; if (inFrame) parent.postMessage({ type: 'slides-fs', on }, location.origin); sync(); };
  fsBtn.onclick = async () => {
    if (isFs()) {
      if (pseudo) setPseudo(false);
      else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    if (native) {
      try {
        const el = document.documentElement;
        await (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen());
        try { await screen.orientation.lock('landscape'); } catch (e) {}
        return;
      } catch (e) { /* 막혀 있으면 아래로 */ }
    }
    setPseudo(true);
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') fsBtn.click(); if (e.key === 'Escape' && pseudo) setPseudo(false); });
  show();
</script>
</body>
</html>
