<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행 장표 · 2026 문인 동문회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 임시 장표입니다. 실제 장표가 완성되면 이 파일을 바꾸면 됩니다. */
  :root { --ink: #3b2a1e; --accent: #c64530; --paper: #fffaf2; }
  html, body { margin: 0; height: 100%; background: #f3e4cf; font-family: "Pretendard Variable", Pretendard, sans-serif; color: var(--ink); }
  .deck { height: 100%; display: flex; flex-direction: column; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .slide { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: var(--paper); border-radius: 18px; box-shadow: 0 10px 30px rgba(70,45,20,.15); display: none; flex-direction: column; justify-content: center; padding: 6% 7%; box-sizing: border-box; }
  .slide.on { display: flex; }
  .slide h1 { font-size: clamp(26px, 6vw, 64px); margin: 0 0 .3em; letter-spacing: -1px; }
  .slide h2 { font-size: clamp(20px, 4vw, 42px); margin: 0 0 .6em; }
  .slide p, .slide li { font-size: clamp(14px, 2.4vw, 26px); line-height: 1.5; margin: .2em 0; }
  .slide .tag { color: var(--accent); font-weight: 800; font-size: clamp(12px, 2vw, 20px); margin-bottom: 1em; }
  .bar { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 8px 0 14px; }
  .bar button { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--paper); font-size: 22px; box-shadow: 0 4px 14px rgba(70,45,20,.15); cursor: pointer; }
  .bar span { min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="deck">
  <div class="stage">
    <section class="slide on"><div class="tag">[임시 장표]</div><h1>2026 문인 동문회</h1><p>연희관 앞마당에 오신 것을 환영합니다</p></section>
    <section class="slide"><h2>오늘의 순서</h2><ul><li>18:00 접수 및 안내</li><li>18:20 식사</li><li>19:10 인사 · 소식나눔 · 럭키드로우</li><li>19:40 관심사별 네트워킹</li><li>20:30 마무리</li></ul></section>
    <section class="slide"><h2>소식나눔</h2><p>폰으로 남긴 소식을 함께 읽어봅니다.</p></section>
  </div>
  <div class="bar"><button id="prev" aria-label="이전 장">‹</button><span id="pg"></span><button id="next" aria-label="다음 장">›</button></div>
</div>
<script>
  const s = [...document.querySelectorAll('.slide')]; let i = 0;
  const show = () => { s.forEach((x, k) => x.classList.toggle('on', k === i)); document.getElementById('pg').textContent = `${i + 1} / ${s.length}`; };
  document.getElementById('prev').onclick = () => { i = Math.max(0, i - 1); show(); };
  document.getElementById('next').onclick = () => { i = Math.min(s.length - 1, i + 1); show(); };
  addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') document.getElementById('next').click(); if (e.key === 'ArrowLeft') document.getElementById('prev').click(); });
  show();
</script>
</body>
</html>
